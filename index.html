<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>רכישת המחברות</title>

  <style>
    :root {
      --primary: #2b57f1;
      --bg: #f8f9fa;
      --text: #333;
      --muted: #666;
    }

    body {
      font-family: -apple-system, system-ui, sans-serif;
      background: var(--bg);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      max-width: 460px;
      width: 92%;
      text-align: center;
    }

    h1 {
      color: var(--text);
      margin-bottom: 1rem;
    }

    p {
      color: var(--muted);
      line-height: 1.6;
    }

    .input-group {
      margin: 1.2rem 0;
      text-align: right;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 8px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 1rem;
      box-sizing: border-box;
    }

    .bit-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 15px;
      width: 100%;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 1rem;
    }

    .bit-btn:hover {
      opacity: 0.95;
    }

    #download-area {
      display: none;
      margin-top: 1.5rem;
      background: #e9f7ef;
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid #c3e6cb;
    }

    .download-link {
      color: #155724;
      font-weight: bold;
      font-size: 1.1rem;
      text-decoration: underline;
    }

    .trust-note {
      margin-top: 1.2rem;
      font-size: 0.85rem;
      color: #888;
      border-top: 1px solid #eee;
      padding-top: 10px;
      font-style: italic;
    }
    .email-link{
    display:inline-block;
    direction:ltr;
    unicode-bidi: plaintext;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    font-size: 0.95em;
    padding: 2px 8px;
    border-radius: 8px;
    background: #f1f3f5;
    border: 1px solid #e6e8eb;
    color: #2b57f1;
    text-decoration: none;
    margin-inline-start: 6px;
  }
  .email-link:hover{
    text-decoration: underline;
  }
  </style>
</head>

<div class="container">
  <h1>רכישת המחברות 📚</h1>

  <!-- שלב 1: פרטים -->
  <div id="step-1">
    <p>אנא הזינו שם מלא להמשך:</p>

    <div class="input-group">
      <label>שם מלא:</label>
      <input id="name" type="text" placeholder="שם מלא" oninput="checkName()">
    </div>

      <button
      id="continue-btn"
      class="bit-btn"
      style="background:#bbb; cursor:not-allowed;"
      disabled
      onclick="goToPayment()">
      המשך
    </button>

  </div>

  <!-- שלב 2: תשלום -->
  <div id="step-2" style="display:none;">
    <p>
      <b>סכום לתשלום:</b> 19 ש״ח<br>
      <b>מספר:</b><br>
      <span style="font-size:1.4rem; color:#2b57f1; font-weight:bold;">
        054-2616416
      </span>
    </p>

    <button class="bit-btn" onclick="openBit()">
      📲 מעבר לאפליקציית Bit
    </button>

    <button class="bit-btn" style="background:#28a745;" onclick="showDownload()">
      שילמתי – פתח הורדה
    </button>
  </div>

  <!-- שלב 3: הורדה -->
  <div id="download-area" style="display:none;">
    <p>תודה רבה על האמון ❤️</p>
    <a
      href="https://drive.google.com/drive/folders/1gyP6tYrXAG_2SME8Xwp3Hu8eQc_TgT9u?usp=drive_link"
      class="download-link"
      target="_blank"
      rel="noopener"
    >
      לחצו כאן לפתיחת תיקיית ההורדה
    </a>
  </div>

  <div class="trust-note">
    ניתן לפנות אליי במייל לקבלת קבלה:
    <a class="email-link" href="mailto:avrahamsapir1@gmail.com">avrahamsapir1@gmail.com</a>
  </div>

</div>


<script>
  function goToPayment() {
      const name = document.getElementById('name').value.trim();
      
      if (!name) {
        alert("אנא מלאו שם מלא כדי להמשיך");
        return;
      }

    document.getElementById('step-1').style.display = 'none';
    document.getElementById('step-2').style.display = 'block';
  }

  function openBit() {
    window.location.href = "bit://";
    setTimeout(() => {
      alert(
        "אם אפליקציית Bit לא נפתחה:\n" +
        "פתחו אותה ידנית ושלחו 19 ש״ח למספר 054-2616416"
      );
    }, 1200);
  }

  function showDownload() {
    document.getElementById('download-area').style.display = 'block';
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }

  function checkName() {
  const name = document.getElementById('name').value.trim();
  const btn = document.getElementById('continue-btn');

  if (name.length > 0) {
    btn.disabled = false;
    btn.style.background = "#2b57f1";
    btn.style.cursor = "pointer";
  } else {
    btn.disabled = true;
    btn.style.background = "#bbb";
    btn.style.cursor = "not-allowed";
  }
}

</script>

</body>
</html>
