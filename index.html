<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>רכישת המחברות</title>

  <style>
    :root {
      --primary: #2b57f1;
      --bg: #f8f9fa;
      --text: #333;
      --muted: #666;
    }

    body {
      font-family: -apple-system, system-ui, sans-serif;
      background: var(--bg);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      max-width: 460px;
      width: 92%;
      text-align: center;
    }

    h1 {
      color: var(--text);
      margin-bottom: 1rem;
    }

    p {
      color: var(--muted);
      line-height: 1.6;
    }

    .input-group {
      margin: 1.2rem 0;
      text-align: right;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 8px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 1rem;
      box-sizing: border-box;
    }

    .bit-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 15px;
      width: 100%;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 1rem;
    }

    .bit-btn:hover {
      opacity: 0.95;
    }

    #download-area {
      display: none;
      margin-top: 1.5rem;
      background: #e9f7ef;
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid #c3e6cb;
    }

    .download-link {
      color: #155724;
      font-weight: bold;
      font-size: 1.1rem;
      text-decoration: underline;
    }

    .trust-note {
      margin-top: 1.2rem;
      font-size: 0.85rem;
      color: #888;
      border-top: 1px solid #eee;
      padding-top: 10px;
      font-style: italic;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>רכישת המחברות 📚</h1>

    <p>
      תודה שאתם בוחרים לתמוך ביצירה שלי.  
      המחיר הוא <b>19 ש״ח</b>.
    </p>

    <div class="input-group">
      <label>שם מלא ומייל (לשליחת קבלה ידנית):</label>
      <input type="text" placeholder="שם מלא">
      <input type="email" placeholder="your@email.com">
    </div>

    <p>
      <b>איך משלמים?</b><br>
      שלחו את הסכום בביט למספר:
      <br>
      <span style="font-size: 1.4rem; color: var(--primary); font-weight: bold;">
        054-2616416
      </span>
    </p>

    <button class="bit-btn" onclick="showDownload()">
      שילמתי בביט – פתח הורדה
    </button>

    <div id="download-area">
      <p>תודה רבה על האמון ❤️</p>
      <a
        href="[https://drive.google.com/drive/u/0/folders/1gyP6tYrXAG_2SME8Xwp3Hu8eQc_TgT9u]"
        class="download-link"
        download
      >
        לחצו כאן להורדת קובץ ה-ZIP
      </a>
    </div>

    <div class="trust-note">
      בחרתי לא להשתמש בסליקה אוטומטית כדי לחסוך עמלות
      ולשמור על מחיר הוגן. המערכת מבוססת על אמון.
      אם אתם צריכים קבלה - שלחו לי מייל.
    </div>
  </div>

  <script>
    function showDownload() {
      document.getElementById('download-area').style.display = 'block';
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
  </script>
</body>
</html>
