<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>בדיקת GitHub Pages</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; background:#f6f7fb; }
    .box { background:#fff; padding:24px; border-radius:12px; box-shadow:0 10px 25px rgba(0,0,0,.08);
           width:min(520px, 92vw); text-align:center; }
    h1 { margin:0 0 10px; }
    p { margin:0 0 16px; color:#444; line-height:1.6; }
    button { background:#2b57f1; color:#fff; border:0; padding:12px 16px; border-radius:10px;
             font-size:1rem; cursor:pointer; }
    #msg { margin-top:12px; color:#0a7a2f; font-weight:600; display:none; }
  </style>
</head>
<body>
  <div class="box">
    <h1>✅ GitHub Pages עובד?</h1>
    <p>אם אתם רואים עברית מיושרת לימין וכפתור כחול — ה־HTML נטען ומרונדר תקין.</p>
    <button onclick="document.getElementById('msg').style.display='block'">לחץ לבדיקה</button>
    <div id="msg">הצלחה! JavaScript עובד 🎉</div>
  </div>
</body>
</html>
